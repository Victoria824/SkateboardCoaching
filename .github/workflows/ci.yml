name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media_service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
        env:
          MEDIA_DATABASE_URL: sqlite:////tmp/snowboard-ci.db
      - run: alembic check
        env:
          MEDIA_DATABASE_URL: sqlite:////tmp/snowboard-ci.db
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
